# Security response headers, included at every add_header level because
# nginx's add_header does not inherit into blocks that declare their own.
# CSP: same-origin only, plus the Open Library endpoints the app calls.
# No inline or eval scripts are shipped by the build, so no unsafe flags.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https://covers.openlibrary.org https://openlibrary.org https://archive.org https://*.archive.org; font-src 'self'; connect-src 'self' https://openlibrary.org https://covers.openlibrary.org https://archive.org https://*.archive.org; manifest-src 'self'; worker-src 'self'; child-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# no COEP here: require-corp would block cover images from
# covers.openlibrary.org, which is the whole point of the app
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), clipboard-read=(), clipboard-write=()" always;
