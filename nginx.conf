# Coverly: static PWA, no server-side logic. Security stance: no
# authentication by design (LAN-only tool, processes nothing on the
# server), hardened with CSP + response headers (security-headers.conf),
# a read-only container, and client-side input validation.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml
               application/manifest+json;

    include /etc/nginx/security-headers.conf;

    # no dotfiles, no listing, nothing outside the build directory
    location ~ /\. { deny all; }
    autoindex off;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/security-headers.conf;
        try_files $uri =404;
    }

    location = /sw.js            {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }
    location = /registerSW.js    {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
        types { } default_type application/manifest+json;
    }

    location / {
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
